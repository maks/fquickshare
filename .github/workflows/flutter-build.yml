name: Build Flutter App

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libfuse2 \
            wget

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Build AppImage
        run: |
          set -euxo pipefail
          VERSION="$(ruby -e 'puts File.read("pubspec.yaml")[/^\s*version:\s*([^\s]+)/,1]')"
          APPDIR="$PWD/AppDir"
          BUNDLE_DIR="build/linux/x64/release/bundle"
          APPIMAGE_NAME="fquickshare-${VERSION}-x86_64.AppImage"

          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"

          cp -a "$BUNDLE_DIR/." "$APPDIR/usr/bin/"
          cp "linux/packaging/appimage/fquickshare.desktop" "$APPDIR/"
          cp "linux/packaging/appimage/fquickshare.svg" "$APPDIR/"
          cp "linux/packaging/appimage/fquickshare.png" "$APPDIR/"

          cat > "$APPDIR/AppRun" << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/fquickshare" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage "$APPDIR" "$APPIMAGE_NAME"

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: fquickshare-*-x86_64.AppImage

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-bundle
          path: build/linux/x64/release/bundle

      - name: Upload AppImage to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: fquickshare-*-x86_64.AppImage
